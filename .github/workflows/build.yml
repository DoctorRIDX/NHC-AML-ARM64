name: Build NHC (ARM64)

on:
  workflow_dispatch:
    inputs:
      aml_ref:
        description: "AndroidModLoader git ref for the mod headers (branch, tag or commit). Pin a commit after your first good build."
        required: false
        default: "main"
  push:
    branches: [main]

permissions:
  contents: read

jobs:
  build:
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    steps:
      - name: Checkout NHC
        uses: actions/checkout@v4

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"

      - name: Set up Android NDK r27c
        id: ndk
        uses: nttld/setup-ndk@v1
        with:
          ndk-version: r27c

      - name: Unit tests (host)
        run: |
          python3 tests/check_entries_sync.py
          make -C tests CXXFLAGS="-std=c++17 -O1 -g -Wall -Wextra -Wno-unused-parameter -I../include -I."

      - name: Fetch AML mod headers
        env:
          AML_REF: ${{ inputs.aml_ref || 'main' }}
        run: |
          set -eu
          mkdir -p build/aml
          cd build/aml
          git init -q
          git remote add origin https://github.com/RusJJ/AndroidModLoader.git
          git fetch --depth 1 origin "$AML_REF"
          git checkout -q FETCH_HEAD
          echo "AML commit: $(git rev-parse HEAD)" | tee -a "$GITHUB_STEP_SUMMARY"
          cd ../..
          test -f build/aml/mod/amlmod.h || { echo "::error::mod/amlmod.h not found in the AML checkout"; exit 1; }
          grep -n "define IAML_VER" build/aml/mod/*.h | tee build/iaml_ver.txt
          rm -rf include/mod
          mkdir -p include/mod
          cp -r build/aml/mod/. include/mod/

      - name: Build menu DEX (Java -> classes.dex -> header)
        run: sh tools/build_ui_dex.sh

      - name: Build libNHC.so (arm64-v8a)
        run: |
          set -o pipefail
          "${{ steps.ndk.outputs.ndk-path }}/ndk-build" \
            NDK_PROJECT_PATH="$PWD" \
            APP_BUILD_SCRIPT="$PWD/Android.mk" \
            NDK_APPLICATION_MK="$PWD/Application.mk" \
            NDK_OUT="$PWD/build/obj" \
            NDK_LIBS_OUT="$PWD/build/libs" \
            -j"$(nproc)" 2>&1 | tee build/ndk.log
          test -f build/libs/arm64-v8a/libNHC.so

      - name: Check the library
        run: |
          file build/libs/arm64-v8a/libNHC.so
          "${{ steps.ndk.outputs.ndk-path }}/toolchains/llvm/prebuilt/linux-x86_64/bin/llvm-readelf" -h build/libs/arm64-v8a/libNHC.so | grep -E "Machine|Class"
          "${{ steps.ndk.outputs.ndk-path }}/toolchains/llvm/prebuilt/linux-x86_64/bin/llvm-nm" -D --defined-only build/libs/arm64-v8a/libNHC.so | grep -E "OnModLoad|OnModPreLoad|__GetModInfo"

      - name: Package NHC.zip
        run: |
          set -eu
          rm -rf stage && mkdir -p stage/NHC
          cp build/libs/arm64-v8a/libNHC.so stage/NHC/
          cp mod/nhc.ini.example stage/NHC/
          cp -r tools stage/NHC/tools
          cp README.md INSTALL.md USAGE.md COMPATIBILITY.md FEATURES.md LICENSE stage/NHC/
          (cd stage && zip -r ../NHC.zip NHC)
          unzip -l NHC.zip

      - name: Upload NHC-ARM64-RELEASE
        uses: actions/upload-artifact@v4
        with:
          name: NHC-ARM64-RELEASE
          path: NHC.zip
          if-no-files-found: error

      - name: Build failure details
        if: failure()
        run: |
          {
            echo "### NHC build failed"
            echo "Last lines of the NDK log (if it ran):"
            echo '```'
            tail -n 60 build/ndk.log 2>/dev/null || echo "(no ndk.log: the failure happened before ndk-build)"
            echo '```'
          } >> "$GITHUB_STEP_SUMMARY"

      - name: Upload build log on failure
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: NHC-BUILD-LOG
          path: |
            build/ndk.log
            build/iaml_ver.txt
          if-no-files-found: ignore
