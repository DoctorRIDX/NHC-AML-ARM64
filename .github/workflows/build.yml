name: NHC ARM64 Plugin Build

on:
  workflow_dispatch:
  push:
    branches: [ "main" ]
  pull_request:
    branches: [ "main" ]

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout NHC source
        uses: actions/checkout@v4

      - name: Install Android NDK
        uses: nttld/setup-ndk@v1
        with:
          ndk-version: r24

      - name: Build NHC ARM64 plugin
        run: |
          ndk-build NDK_PROJECT_PATH=. \
            APP_BUILD_SCRIPT=./Android.mk \
            NDK_APPLICATION_MK=./Application.mk \
            NDK_DEBUG=0 -j2

      - name: Upload ARM64 plugin artifact
        uses: actions/upload-artifact@v4
        with:
          name: NHC-ARM64-dev
          path: libs/arm64-v8a/libnhc.so
          if-no-files-found: error
